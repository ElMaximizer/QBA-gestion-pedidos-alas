name: Deploy QBA VPS

on:
  push:
    branches: [produccion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qba-vps-produccion
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/produccion'
    runs-on: ubuntu-latest
    environment: vps-produccion
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Desplegar el commit por SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          : "${VPS_HOST:?Falta VPS_HOST}"
          : "${VPS_USER:?Falta VPS_USER}"
          : "${VPS_SSH_KEY:?Falta VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Falta VPS_KNOWN_HOSTS}"

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_HOST" = 40.160.100.156 ]]
          [[ "$VPS_USER" = deploy-qba ]]

          clave="$RUNNER_TEMP/qba-deploy-key"
          conocidos="$RUNNER_TEMP/qba-known-hosts"
          trap 'rm -f "$clave" "$conocidos"' EXIT

          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$clave"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$conocidos"

          ssh-keygen -y -P '' -f "$clave" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$conocidos" >/dev/null

          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$conocidos" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$clave" \
            "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA"
